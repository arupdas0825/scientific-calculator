<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scientific Calculator Pro Max</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>

<style>

:root{
  --bg1:#1e293b;
  --bg2:#020617;
  --card:#0f172a;
  --text:#ffffff;
  --muted:#94a3b8;

  --number:#111827;

  --function1:#7c3aed;
  --function2:#6d28d9;

  --operator1:#0ea5e9;
  --operator2:#0284c7;

  --equal1:#14b8a6;
  --equal2:#0f766e;
}

body.amoled{
  --bg1:#000;
  --bg2:#000;
  --card:#000;
}

body.neon{
  --bg1:#111827;
  --bg2:#020617;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  min-height:100vh;
  background:
  radial-gradient(circle at top,
  var(--bg1),
  var(--bg2) 70%);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:20px;
  color:var(--text);
}

.wrapper{
  width:100%;
  max-width:1300px;
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
}

/* ================= CALCULATOR ================= */

.calculator{
  width:470px;
  background:var(--card);
  border-radius:28px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:
  0 30px 70px rgba(0,0,0,0.5);
}

.top{
  padding:24px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}

.title{
  font-size:12px;
  letter-spacing:3px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:16px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.toolbar-group{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.small-btn{
  border:none;
  background:#1e293b;
  color:white;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:11px;
  font-weight:700;
}

.graph-btn{
  background:linear-gradient(135deg,#8b5cf6,#7c3aed);
}

.solve-btn{
  background:linear-gradient(135deg,#f59e0b,#d97706);
}

.history-expression{
  text-align:right;
  color:#64748b;
  min-height:20px;
  margin-bottom:10px;
  font-size:14px;
}

.display{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  text-align:right;
  font-size:2.8rem;
  font-weight:700;
}

/* ================= KEYPAD ================= */

.keypad{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.scientific-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.main-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.variable-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

button{
  border:none;
  height:62px;
  border-radius:18px;
  color:white;
  cursor:pointer;
  font-size:16px;
  font-weight:700;
  transition:0.2s;
}

button:hover{
  transform:translateY(-2px);
}

button:active{
  transform:scale(0.96);
}

.number{
  background:var(--number);
}

.function{
  background:
  linear-gradient(135deg,
  var(--function1),
  var(--function2));
}

.operator{
  background:
  linear-gradient(135deg,
  var(--operator1),
  var(--operator2));
}

.equal{
  background:
  linear-gradient(135deg,
  var(--equal1),
  var(--equal2));
  height:136px;
  grid-row:span 2;
}

.clear{
  background:
  linear-gradient(135deg,#ef4444,#dc2626);
}

.zero{
  grid-column:span 2;
}

/* ================= SIDE PANEL ================= */

.side-panel{
  width:320px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.panel{
  background:var(--card);
  border-radius:24px;
  padding:18px;
  border:1px solid rgba(255,255,255,0.06);
}

.panel-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:14px;
}

.history-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  max-height:300px;
  overflow:auto;
}

.history-item{
  background:#111827;
  border-radius:14px;
  padding:12px;
  cursor:pointer;
}

.expression{
  color:#94a3b8;
  font-size:13px;
  margin-bottom:4px;
}

.answer{
  font-size:16px;
  font-weight:700;
}

.solver-result{
  line-height:1.7;
  color:#e2e8f0;
}

/* ================= GRAPH ================= */

.graph-panel{
  width:100%;
  background:var(--card);
  border-radius:28px;
  padding:20px;
  border:1px solid rgba(255,255,255,0.06);
  display:none;
}

.graph-panel.open{
  display:block;
}

.graph-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.graph-title{
  font-size:18px;
  font-weight:700;
}

.graph-controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.graph-input{
  flex:1;
  min-width:220px;
  background:#111827;
  border:none;
  outline:none;
  color:white;
  padding:12px;
  border-radius:12px;
}

.plot-btn{
  background:
  linear-gradient(135deg,#8b5cf6,#7c3aed);
  padding:0 18px;
}

canvas{
  width:100%;
  height:420px;
  background:#020617;
  border-radius:18px;
}

.graph-note{
  margin-top:10px;
  color:#64748b;
  font-size:13px;
  text-align:center;
}

.footer{
  padding:12px;
  text-align:center;
  color:#64748b;
  font-size:11px;
  border-top:1px solid rgba(255,255,255,0.05);
}

/* ================= MOBILE ================= */

@media(max-width:1100px){

  .wrapper{
    flex-direction:column;
    align-items:center;
  }

  .side-panel{
    width:470px;
  }
}

@media(max-width:520px){

  .calculator,
  .side-panel{
    width:100%;
  }

  button{
    height:56px;
    font-size:14px;
  }

  .equal{
    height:122px;
  }

  .display{
    font-size:2.2rem;
  }

  canvas{
    height:280px;
  }
}

</style>
</head>

<body>

<div class="wrapper">

  <!-- CALCULATOR -->

  <div class="calculator">

    <div class="top">

      <div class="title">
        Scientific Calculator Pro Max
      </div>

      <div class="toolbar">

        <div class="toolbar-group">

          <button class="small-btn"
          onclick="setTheme('default')">
          Default
          </button>

          <button class="small-btn"
          onclick="setTheme('amoled')">
          AMOLED
          </button>

          <button class="small-btn"
          onclick="setTheme('neon')">
          Neon
          </button>

        </div>

        <div class="toolbar-group">

          <button class="small-btn graph-btn"
          onclick="openGraph()">
          📈 Graph
          </button>

          <button class="small-btn solve-btn"
          onclick="solveEquation()">
          Solve
          </button>

        </div>

      </div>

      <div class="history-expression"
      id="historyExpression"></div>

      <input type="text"
      id="display"
      class="display"
      readonly>

    </div>

    <div class="keypad">

      <!-- SCIENTIFIC -->

      <div class="scientific-grid">

        <button class="function"
        onclick="append('sin(')">sin</button>

        <button class="function"
        onclick="append('cos(')">cos</button>

        <button class="function"
        onclick="append('tan(')">tan</button>

        <button class="function"
        onclick="append('log(')">log</button>

        <button class="function"
        onclick="append('ln(')">ln</button>

        <button class="function"
        onclick="append('sqrt(')">√</button>

        <button class="function"
        onclick="append('^')">xʸ</button>

        <button class="function"
        onclick="append('!')">x!</button>

        <button class="function"
        onclick="append('pi')">π</button>

        <button class="function"
        onclick="append('e')">e</button>

      </div>

      <!-- VARIABLES -->

      <div class="variable-grid">

        <button class="function"
        onclick="append('x')">X</button>

        <button class="function"
        onclick="append('y')">Y</button>

        <button class="function"
        onclick="append('a')">A</button>

        <button class="function"
        onclick="append('b')">B</button>

        <button class="function"
        onclick="append('c')">C</button>

        <button class="function"
        onclick="append('d')">D</button>

      </div>

      <!-- MAIN -->

      <div class="main-grid">

        <button class="clear"
        onclick="clearDisplay()">AC</button>

        <button class="function"
        onclick="backspace()">⌫</button>

        <button class="function"
        onclick="append('(')">(</button>

        <button class="function"
        onclick="append(')')">)</button>

        <button class="number"
        onclick="append('7')">7</button>

        <button class="number"
        onclick="append('8')">8</button>

        <button class="number"
        onclick="append('9')">9</button>

        <button class="operator"
        onclick="append('/')">÷</button>

        <button class="number"
        onclick="append('4')">4</button>

        <button class="number"
        onclick="append('5')">5</button>

        <button class="number"
        onclick="append('6')">6</button>

        <button class="operator"
        onclick="append('*')">×</button>

        <button class="number"
        onclick="append('1')">1</button>

        <button class="number"
        onclick="append('2')">2</button>

        <button class="number"
        onclick="append('3')">3</button>

        <button class="operator"
        onclick="append('-')">−</button>

        <button class="number zero"
        onclick="append('0')">0</button>

        <button class="number"
        onclick="append('.')">.</button>

        <button class="operator"
        onclick="append('+')">+</button>

        <button class="equal"
        onclick="calculate()">=</button>

      </div>

    </div>

    <div class="footer">
      Fixed Calculator + Advanced Graphing + Equation Solver
    </div>

  </div>

  <!-- SIDE PANEL -->

  <div class="side-panel">

    <div class="panel">

      <div class="panel-title">
        History
      </div>

      <div class="history-list"
      id="historyList"></div>

    </div>

    <div class="panel">

      <div class="panel-title">
        Equation Solver
      </div>

      <div class="solver-result"
      id="solverResult">

      Enter:
      <br><br>

      2x+5=15

      </div>

    </div>

  </div>

  <!-- GRAPH -->

  <div class="graph-panel"
  id="graphPanel">

    <div class="graph-top">

      <div class="graph-title">
        Interactive Graph
      </div>

      <button class="small-btn"
      onclick="closeGraph()">
      Close
      </button>

    </div>

    <div class="graph-controls">

      <input type="text"
      id="graphInput"
      class="graph-input"
      placeholder="Example: x^2 + 5*x + 2">

      <button class="small-btn plot-btn"
      onclick="drawGraph()">
      Plot
      </button>

    </div>

    <canvas id="graphCanvas"></canvas>

    <div class="graph-note">
      Supports functions like:
      sin(x), x^2, log(x), sqrt(x)
    </div>

  </div>

</div>

<script>

const display =
document.getElementById("display");

const historyExpression =
document.getElementById("historyExpression");

const historyList =
document.getElementById("historyList");

const solverResult =
document.getElementById("solverResult");

let ans = 0;

/* ================= BASIC ================= */

function append(v){

  display.value += v;
}

function clearDisplay(){

  display.value = "";
  historyExpression.innerText = "";
}

function backspace(){

  display.value =
  display.value.slice(0,-1);
}

/* ================= SMART FIX ================= */

function smartFix(exp){

  exp = exp
  .replace(/÷/g,"/")
  .replace(/×/g,"*");

  exp = exp
  .replace(/(\d)([a-zA-Z])/g,"$1*$2");

  exp = exp
  .replace(/([a-zA-Z])(\d)/g,"$1*$2");

  exp = exp
  .replace(/(\))(\d)/g,")*$2");

  exp = exp
  .replace(/(\d)(\()/g,"$1*(");

  return exp;
}

/* ================= CALCULATE ================= */

function calculate(){

  try{

    let exp = display.value;

    if(!exp) return;

    exp = smartFix(exp);

    historyExpression.innerText =
    exp;

    let result =
    math.evaluate(exp,{
      ans
    });

    if(typeof result === "number"){

      result =
      parseFloat(result.toFixed(10));
    }

    display.value = result;

    ans = result;

    addHistory(exp,result);

  }catch{

    display.value = "Invalid";
  }
}

/* ================= HISTORY ================= */

function addHistory(exp,result){

  const item =
  document.createElement("div");

  item.className = "history-item";

  item.innerHTML = `
    <div class="expression">
    ${exp}
    </div>

    <div class="answer">
    ${result}
    </div>
  `;

  item.onclick = ()=>{

    display.value = exp;
  };

  historyList.prepend(item);
}

/* ================= EQUATION SOLVER ================= */

function solveEquation(){

  try{

    let eq =
    display.value;

    if(!eq.includes("=")){

      solverResult.innerHTML =
      "Use equation with = sign";

      return;
    }

    eq = smartFix(eq);

    let parts = eq.split("=");

    let left = parts[0];
    let right = parts[1];

    const expr =
    math.simplify(
      `(${left}) - (${right})`
    ).toString();

    let solutions = [];

    for(let x=-100;
    x<=100;
    x+=0.01){

      let val =
      math.evaluate(expr,{x});

      if(Math.abs(val)<0.01){

        solutions.push(
        Number(x.toFixed(2)));
      }
    }

    solutions =
    [...new Set(solutions)];

    if(solutions.length===0){

      solverResult.innerHTML =
      "No Solution";

      return;
    }

    solverResult.innerHTML =
    `
    Equation:
    <br><br>

    ${eq}

    <br><br>

    Solution:
    <br><br>

    x = ${solutions.join(", ")}
    `;

  }catch{

    solverResult.innerHTML =
    "Invalid Equation";
  }
}

/* ================= THEME ================= */

function setTheme(t){

  document.body.classList.remove(
  "amoled",
  "neon");

  if(t!=="default"){

    document.body.classList.add(t);
  }
}

/* ================= GRAPH ================= */

const graphPanel =
document.getElementById("graphPanel");

const graphInput =
document.getElementById("graphInput");

const canvas =
document.getElementById("graphCanvas");

const ctx =
canvas.getContext("2d");

function openGraph(){

  graphPanel.classList.add("open");

  graphInput.value =
  display.value;
}

function closeGraph(){

  graphPanel.classList.remove("open");
}

function drawGraph(){

  const expr =
  graphInput.value.trim();

  if(!expr) return;

  canvas.width =
  canvas.offsetWidth;

  canvas.height = 420;

  ctx.clearRect(
  0,0,
  canvas.width,
  canvas.height);

  /* GRID */

  ctx.strokeStyle =
  "rgba(255,255,255,0.08)";

  for(let i=0;
  i<canvas.width;
  i+=40){

    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,canvas.height);
    ctx.stroke();
  }

  for(let i=0;
  i<canvas.height;
  i+=40){

    ctx.beginPath();
    ctx.moveTo(0,i);
    ctx.lineTo(canvas.width,i);
    ctx.stroke();
  }

  /* AXIS */

  ctx.strokeStyle =
  "#94a3b8";

  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(0,canvas.height/2);
  ctx.lineTo(canvas.width,
  canvas.height/2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(canvas.width/2,0);
  ctx.lineTo(canvas.width/2,
  canvas.height);
  ctx.stroke();

  /* FUNCTION */

  ctx.strokeStyle =
  "#8b5cf6";

  ctx.lineWidth = 3;

  ctx.beginPath();

  let started = false;

  for(let px=0;
  px<canvas.width;
  px++){

    let x =
    (px-canvas.width/2)/25;

    try{

      let y =
      math.evaluate(expr,{x});

      let py =
      canvas.height/2
      - y*25;

      if(!started){

        ctx.moveTo(px,py);
        started = true;

      }else{

        ctx.lineTo(px,py);
      }

    }catch{}
  }

  ctx.stroke();
}

/* ================= KEYBOARD ================= */

document.addEventListener(
"keydown",(e)=>{

  if(
  (e.key>=0&&e.key<=9)
  ||
  "+-*/.%()^=xyabcd"
  .includes(e.key.toLowerCase())
  ){

    append(e.key);
  }

  else if(e.key==="Enter"){

    calculate();
  }

  else if(e.key==="Backspace"){

    backspace();
  }

  else if(
  e.key.toLowerCase()==="c"
  ){

    clearDisplay();
  }
});

</script>

</body>
</html>
