<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuantumCalc Pro</title>

  <!-- Math.js -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.min.js"></script>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#060816;
      --card:#0d1324;
      --card-2:#121a2f;
      --border:rgba(255,255,255,0.08);
      --text:#f5f7ff;
      --muted:#8b93b0;
      --primary:#6ea8fe;
      --primary-glow:rgba(110,168,254,0.35);
      --success:#4ade80;
      --danger:#fb7185;
      --operator:#f59e0b;
      --shadow:0 20px 60px rgba(0,0,0,0.45);
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(110,168,254,0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(74,222,128,0.08), transparent 30%),
        var(--bg);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      overflow-x:hidden;
      font-family:'Inter',sans-serif;
      color:var(--text);
    }

    .calculator{
      width:100%;
      max-width:430px;
      background:linear-gradient(180deg,var(--card),var(--card-2));
      border:1px solid var(--border);
      border-radius:30px;
      overflow:hidden;
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
      position:relative;
    }

    .calculator::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        135deg,
        rgba(255,255,255,0.05),
        transparent 20%,
        transparent 80%,
        rgba(255,255,255,0.03)
      );
      pointer-events:none;
    }

    .top{
      padding:28px 24px 18px;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    .brand{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:22px;
    }

    .brand-left h1{
      font-size:1.2rem;
      font-weight:700;
      letter-spacing:-0.03em;
    }

    .brand-left p{
      color:var(--muted);
      font-size:0.8rem;
      margin-top:4px;
    }

    .live-dot{
      width:12px;
      height:12px;
      border-radius:50%;
      background:var(--success);
      box-shadow:0 0 18px var(--success);
      animation:pulse 1.8s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
        opacity:1;
      }
      50%{
        transform:scale(1.25);
        opacity:0.6;
      }
      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    .expression{
      min-height:34px;
      font-size:0.95rem;
      color:var(--muted);
      text-align:right;
      overflow-x:auto;
      white-space:nowrap;
      scrollbar-width:none;
    }

    .expression::-webkit-scrollbar{
      display:none;
    }

    .result{
      margin-top:8px;
      min-height:72px;
      text-align:right;
      font-size:2.8rem;
      font-weight:700;
      letter-spacing:-0.04em;
      overflow-x:auto;
      white-space:nowrap;
      scrollbar-width:none;
    }

    .result::-webkit-scrollbar{
      display:none;
    }

    .buttons{
      padding:22px;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
    }

    button{
      border:none;
      outline:none;
      height:62px;
      border-radius:18px;
      font-size:1rem;
      font-weight:600;
      color:var(--text);
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.05);
      cursor:pointer;
      transition:0.18s ease;
      position:relative;
      overflow:hidden;
      user-select:none;
    }

    button:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,0.07);
    }

    button:active{
      transform:scale(0.96);
    }

    .num{
      background:rgba(255,255,255,0.03);
    }

    .func{
      color:var(--primary);
      background:rgba(110,168,254,0.08);
    }

    .operator{
      color:var(--operator);
      background:rgba(245,158,11,0.08);
    }

    .danger{
      color:var(--danger);
      background:rgba(251,113,133,0.08);
    }

    .equal{
      grid-column:span 2;
      background:linear-gradient(
        135deg,
        #3b82f6,
        #2563eb
      );
      color:white;
      box-shadow:0 10px 30px var(--primary-glow);
    }

    .equal:hover{
      background:linear-gradient(
        135deg,
        #4b8fff,
        #2d6fff
      );
    }

    .footer{
      text-align:center;
      padding:0 20px 22px;
      color:var(--muted);
      font-size:0.72rem;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }

    @media(max-width:520px){

      .calculator{
        border-radius:24px;
      }

      .top{
        padding:22px 18px 14px;
      }

      .buttons{
        padding:18px;
        gap:10px;
      }

      button{
        height:56px;
        border-radius:16px;
        font-size:0.92rem;
      }

      .result{
        font-size:2.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="calculator">

    <div class="top">

      <div class="brand">
        <div class="brand-left">
          <h1>QuantumCalc Pro</h1>
          <p>Elite Scientific Computing Engine</p>
        </div>

        <div class="live-dot"></div>
      </div>

      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>

    </div>

    <div class="buttons">

      <!-- Row 1 -->
      <button class="danger" onclick="clearAll()">AC</button>
      <button class="danger" onclick="backspace()">DEL</button>
      <button class="func" onclick="append('(')">(</button>
      <button class="func" onclick="append(')')">)</button>
      <button class="operator" onclick="append('/')">÷</button>

      <!-- Row 2 -->
      <button class="func" onclick="append('sin(')">sin</button>
      <button class="func" onclick="append('cos(')">cos</button>
      <button class="func" onclick="append('tan(')">tan</button>
      <button class="func" onclick="append('sqrt(')">√</button>
      <button class="operator" onclick="append('*')">×</button>

      <!-- Row 3 -->
      <button class="func" onclick="append('log10(')">log</button>
      <button class="func" onclick="append('log(')">ln</button>
      <button class="func" onclick="append('pi')">π</button>
      <button class="func" onclick="append('e')">e</button>
      <button class="operator" onclick="append('-')">−</button>

      <!-- Row 4 -->
      <button class="num" onclick="append('7')">7</button>
      <button class="num" onclick="append('8')">8</button>
      <button class="num" onclick="append('9')">9</button>
      <button class="func" onclick="append('^')">xʸ</button>
      <button class="operator" onclick="append('+')">+</button>

      <!-- Row 5 -->
      <button class="num" onclick="append('4')">4</button>
      <button class="num" onclick="append('5')">5</button>
      <button class="num" onclick="append('6')">6</button>
      <button class="func" onclick="append('abs(')">|x|</button>
      <button class="func" onclick="append('!')">n!</button>

      <!-- Row 6 -->
      <button class="num" onclick="append('1')">1</button>
      <button class="num" onclick="append('2')">2</button>
      <button class="num" onclick="append('3')">3</button>
      <button class="func" onclick="append('asin(')">sin⁻¹</button>
      <button class="func" onclick="append('acos(')">cos⁻¹</button>

      <!-- Row 7 -->
      <button class="num" onclick="append('0')">0</button>
      <button class="num" onclick="append('.')">.</button>
      <button class="func" onclick="append('i')">i</button>
      <button class="func" onclick="append('atan(')">tan⁻¹</button>

      <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="footer">
      PROFESSIONAL SCIENTIFIC CALCULATOR • V4.0
    </div>

  </div>

  <script>

    const expression = document.getElementById("expression");
    const result = document.getElementById("result");

    let current = "";

    function updateDisplay(){
      expression.textContent = current || "";
    }

    function append(value){

      if(result.textContent === "Error"){
        result.textContent = "0";
      }

      current += value;
      updateDisplay();
    }

    function clearAll(){
      current = "";
      expression.textContent = "";
      result.textContent = "0";
    }

    function backspace(){
      current = current.slice(0,-1);
      updateDisplay();
    }

    function formatResult(value){

      if(typeof value === "number"){

        if(!isFinite(value)){
          return "Infinity";
        }

        if(Math.abs(value) < 1e-12){
          return "0";
        }

        return Number(value.toPrecision(12)).toString();
      }

      if(math.typeOf(value) === "Complex"){
        return value.toString();
      }

      if(Array.isArray(value)){
        return JSON.stringify(value);
      }

      return value.toString();
    }

    function preprocess(expr){

      return expr
        .replace(/÷/g,'/')
        .replace(/×/g,'*')
        .replace(/π/g,'pi')

        // implicit multiplication
        .replace(/(\d)(\()/g,'$1*$2')
        .replace(/(\))(\d)/g,'$1*$2')
        .replace(/(\))(\()/g,'$1*$2')
        .replace(/pi(\d)/g,'pi*$1')
        .replace(/e(\d)/g,'e*$1')
        .replace(/(\d)i/g,'$1*i')

        // factorial
        .replace(/(\d+)!/g,'factorial($1)');
    }

    function calculate(){

      if(!current.trim()) return;

      try{

        let processed = preprocess(current);

        let evaluated = math.evaluate(processed);

        result.textContent = formatResult(evaluated);

      }catch(err){

        console.error(err);

        result.textContent = "Error";
      }
    }

    // Keyboard Support

    document.addEventListener("keydown",(e)=>{

      const key = e.key;

      if(/[0-9+\-*/.^()]/.test(key)){
        append(key);
      }

      else if(key === "Enter"){
        e.preventDefault();
        calculate();
      }

      else if(key === "Backspace"){
        backspace();
      }

      else if(key === "Escape"){
        clearAll();
      }
    });

  </script>

</body>
</html>
