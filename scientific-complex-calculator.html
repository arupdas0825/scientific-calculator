<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Scientific Calculator Pro</title>

<!-- MATH.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>

<style>

/* ================= ROOT THEMES ================= */

:root{

    --bg1:#1e293b;
    --bg2:#020617;

    --card:rgba(15,23,42,0.96);

    --number:#0f172a;

    --function1:#6366f1;
    --function2:#4f46e5;

    --operator1:#0ea5e9;
    --operator2:#0284c7;

    --equal1:#14b8a6;
    --equal2:#0f766e;
}

/* AMOLED THEME */

body.amoled{

    --bg1:#000000;
    --bg2:#000000;

    --card:#000000;

    --number:#050505;

    --function1:#7c3aed;
    --function2:#6d28d9;

    --operator1:#2563eb;
    --operator2:#1d4ed8;

    --equal1:#059669;
    --equal2:#047857;
}

/* NEON THEME */

body.neon{

    --bg1:#111827;
    --bg2:#020617;

    --card:#111827;

    --number:#0f172a;

    --function1:#ff00ff;
    --function2:#c026d3;

    --operator1:#00e5ff;
    --operator2:#0891b2;

    --equal1:#00ff99;
    --equal2:#059669;
}

/* ================= GLOBAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(circle at top,
    var(--bg1),
    var(--bg2) 70%);

    padding:20px;

    transition:0.3s;
}

/* ================= WRAPPER ================= */

.wrapper{

    display:flex;

    gap:24px;

    align-items:flex-start;

    flex-wrap:wrap;
}

/* ================= CALCULATOR ================= */

.calculator{

    width:470px;

    background:var(--card);

    border-radius:30px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,0.06);

    box-shadow:
    0 30px 80px rgba(0,0,0,0.55);

    transition:0.3s;
}

/* ================= DISPLAY ================= */

.top{

    padding:30px 25px;

    border-bottom:1px solid rgba(255,255,255,0.06);
}

.title{

    color:#94a3b8;

    font-size:13px;

    letter-spacing:3px;

    margin-bottom:18px;

    text-transform:uppercase;
}

/* ================= TOOLBAR ================= */

.toolbar{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-bottom:20px;
}

.theme-btn{

    border:none;

    padding:10px 14px;

    border-radius:12px;

    cursor:pointer;

    background:#1e293b;

    color:white;

    font-size:12px;

    font-weight:600;

    transition:0.2s;
}

.theme-btn:hover{

    opacity:0.8;
}

.history-expression{

    text-align:right;

    color:#64748b;

    min-height:22px;

    margin-bottom:12px;

    overflow-x:auto;

    font-size:15px;
}

.display{

    width:100%;

    background:transparent;

    border:none;

    outline:none;

    color:white;

    text-align:right;

    font-size:3rem;

    font-weight:700;
}

/* ================= KEYPAD ================= */

.keypad{

    padding:20px;

    display:flex;

    flex-direction:column;

    gap:18px;
}

/* ================= SCIENTIFIC GRID ================= */

.scientific-grid{

    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:12px;
}

/* ================= MAIN GRID ================= */

.main-grid{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:14px;
}

/* ================= BUTTON ================= */

button{

    border:none;

    height:68px;

    border-radius:20px;

    cursor:pointer;

    color:white;

    font-size:18px;

    font-weight:600;

    transition:0.2s;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.04),
    0 8px 18px rgba(0,0,0,0.3);
}

button:hover{

    transform:translateY(-2px);
}

button:active{

    transform:scale(0.96);
}

/* ================= BUTTON TYPES ================= */

.number{

    background:var(--number);
}

.operator{

    background:
    linear-gradient(135deg,
    var(--operator1),
    var(--operator2));
}

.function{

    background:
    linear-gradient(135deg,
    var(--function1),
    var(--function2));
}

.clear{

    background:
    linear-gradient(135deg,#ef4444,#dc2626);
}

.equal{

    background:
    linear-gradient(135deg,
    var(--equal1),
    var(--equal2));

    height:150px;

    grid-row:span 2;
}

.zero{

    grid-column:span 2;
}

/* ================= HISTORY PANEL ================= */

.side-panel{

    width:290px;

    background:var(--card);

    border-radius:26px;

    padding:22px;

    border:1px solid rgba(255,255,255,0.06);

    box-shadow:
    0 20px 50px rgba(0,0,0,0.45);

    transition:0.3s;
}

.side-title{

    color:white;

    margin-bottom:18px;

    font-size:18px;

    font-weight:700;
}

.history-list{

    display:flex;

    flex-direction:column;

    gap:12px;

    max-height:650px;

    overflow:auto;
}

.history-item{

    background:#0f172a;

    border-radius:18px;

    padding:15px;

    cursor:pointer;

    transition:0.2s;

    border:1px solid rgba(255,255,255,0.04);
}

.history-item:hover{

    background:#172554;
}

.expression{

    color:#94a3b8;

    font-size:14px;

    margin-bottom:6px;

    word-break:break-all;
}

.answer{

    color:white;

    font-size:18px;

    font-weight:700;
}

/* ================= FOOTER ================= */

.footer{

    padding:14px;

    text-align:center;

    color:#64748b;

    font-size:12px;

    border-top:1px solid rgba(255,255,255,0.05);
}

/* ================= MOBILE ================= */

@media(max-width:980px){

    .wrapper{

        justify-content:center;
    }

    .side-panel{

        width:100%;
    }
}

@media(max-width:520px){

    .calculator{

        width:100%;
    }

    button{

        height:60px;

        font-size:15px;
    }

    .equal{

        height:134px;
    }

    .display{

        font-size:2.3rem;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- ================= CALCULATOR ================= -->

    <div class="calculator">

        <div class="top">

            <div class="title">
                AI Scientific Calculator Pro
            </div>

            <!-- TOOLBAR -->

            <div class="toolbar">

                <button 
                    class="theme-btn"
                    onclick="setTheme('default')"
                >
                    Default
                </button>

                <button 
                    class="theme-btn"
                    onclick="setTheme('amoled')"
                >
                    AMOLED
                </button>

                <button 
                    class="theme-btn"
                    onclick="setTheme('neon')"
                >
                    Neon
                </button>

            </div>

            <div 
                class="history-expression"
                id="historyExpression"
            ></div>

            <input 
                type="text"
                id="display"
                class="display"
                readonly
            />

        </div>

        <!-- ================= KEYPAD ================= -->

        <div class="keypad">

            <!-- SCIENTIFIC -->

            <div class="scientific-grid">

                <button class="function" onclick="append('sin(')">sin</button>

                <button class="function" onclick="append('cos(')">cos</button>

                <button class="function" onclick="append('tan(')">tan</button>

                <button class="function" onclick="append('log(')">log</button>

                <button class="function" onclick="append('ln(')">ln</button>

                <button class="function" onclick="append('sqrt(')">√</button>

                <button class="function" onclick="append('^')">xʸ</button>

                <button class="function" onclick="append('!')">x!</button>

                <button class="function" onclick="append('pi')">π</button>

                <button class="function" onclick="append('e')">e</button>

            </div>

            <!-- MAIN GRID -->

            <div class="main-grid">

                <button class="clear" onclick="clearDisplay()">AC</button>

                <button class="function" onclick="backspace()">⌫</button>

                <button class="function" onclick="append('(')">(</button>

                <button class="operator" onclick="append('/')">÷</button>

                <button class="number" onclick="append('7')">7</button>

                <button class="number" onclick="append('8')">8</button>

                <button class="number" onclick="append('9')">9</button>

                <button class="operator" onclick="append('*')">×</button>

                <button class="number" onclick="append('4')">4</button>

                <button class="number" onclick="append('5')">5</button>

                <button class="number" onclick="append('6')">6</button>

                <button class="operator" onclick="append('-')">−</button>

                <button class="number" onclick="append('1')">1</button>

                <button class="number" onclick="append('2')">2</button>

                <button class="number" onclick="append('3')">3</button>

                <button class="operator" onclick="append('+')">+</button>

                <button class="number zero" onclick="append('0')">0</button>

                <button class="number" onclick="append('.')">.</button>

                <button class="equal" onclick="calculate()">=</button>

            </div>

        </div>

        <div class="footer">
            Theme System + Persistent History Upgrade
        </div>

    </div>

    <!-- ================= HISTORY PANEL ================= -->

    <div class="side-panel">

        <div class="side-title">
            Calculation History
        </div>

        <div 
            class="history-list"
            id="historyList"
        ></div>

    </div>

</div>

<script>

/* ================= ELEMENTS ================= */

const display =
document.getElementById("display");

const historyExpression =
document.getElementById("historyExpression");

const historyList =
document.getElementById("historyList");

/* ================= MEMORY ================= */

let ans = 0;

/* ================= BASIC ================= */

function append(value){

    display.value += value;
}

function clearDisplay(){

    display.value = "";

    historyExpression.innerText = "";
}

function backspace(){

    display.value =
    display.value.slice(0,-1);
}

/* ================= SMART FIX ================= */

function smartFix(expression){

    expression = expression
    .replace(/÷/g,"/")
    .replace(/×/g,"*");

    let open =
    (expression.match(/\(/g)||[]).length;

    let close =
    (expression.match(/\)/g)||[]).length;

    while(close < open){

        expression += ")";
        close++;
    }

    expression =
    expression.replace(/([+\-*/]){2,}/g,
    (match)=>match.slice(-1));

    expression =
    expression.replace(/(\d)(\()/g,"$1*(");

    expression =
    expression.replace(/(\))(\d)/g,")*$2");

    expression =
    expression.replace(
        /(\d)(sin|cos|tan|sqrt|log|ln|abs)/g,
        "$1*$2"
    );

    return expression;
}

/* ================= CALCULATE ================= */

function calculate(){

    try{

        let expression =
        display.value;

        if(!expression) return;

        expression =
        smartFix(expression);

        historyExpression.innerText =
        expression;

        let result =
        math.evaluate(expression,{
            ans:ans
        });

        if(typeof result === "number"){

            result =
            parseFloat(result.toFixed(10));
        }

        ans = result;

        display.value = result;

        addHistory(expression,result);

    }catch(error){

        display.value = "Invalid";
    }
}

/* ================= HISTORY ================= */

function addHistory(exp,result){

    const item =
    document.createElement("div");

    item.className = "history-item";

    item.innerHTML = `

        <div class="expression">
            ${exp}
        </div>

        <div class="answer">
            ${result}
        </div>

    `;

    item.onclick = ()=>{

        display.value = exp;
    };

    historyList.prepend(item);

    saveHistory();
}

/* ================= SAVE HISTORY ================= */

function saveHistory(){

    localStorage.setItem(
        "calculator-history",
        historyList.innerHTML
    );
}

/* LOAD HISTORY */

const savedHistory =
localStorage.getItem(
    "calculator-history"
);

if(savedHistory){

    historyList.innerHTML =
    savedHistory;

    document
    .querySelectorAll(".history-item")
    .forEach(item=>{

        item.onclick = ()=>{

            const exp =
            item.querySelector(
                ".expression"
            ).innerText;

            display.value = exp;
        };
    });
}

/* ================= THEME ================= */

function setTheme(theme){

    document.body.classList.remove(
        "amoled",
        "neon"
    );

    if(theme !== "default"){

        document.body.classList.add(theme);
    }

    localStorage.setItem(
        "calculator-theme",
        theme
    );
}

/* LOAD SAVED THEME */

const savedTheme =
localStorage.getItem(
    "calculator-theme"
);

if(savedTheme){

    setTheme(savedTheme);
}

/* ================= SAVE MEMORY ================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        localStorage.setItem(
            "calculator-ans",
            ans
        );
    }
);

/* LOAD MEMORY */

const savedAns =
localStorage.getItem(
    "calculator-ans"
);

if(savedAns){

    ans = savedAns;
}

/* ================= KEYBOARD ================= */

document.addEventListener("keydown",(e)=>{

    if(

        (e.key >= 0 && e.key <= 9)

        ||

        "+-*/.%()^".includes(e.key)

    ){

        append(e.key);
    }

    else if(e.key === "Enter"){

        calculate();
    }

    else if(e.key === "Backspace"){

        backspace();
    }

    else if(e.key.toLowerCase() === "c"){

        clearDisplay();
    }
});

</script>

</body>
</html>
