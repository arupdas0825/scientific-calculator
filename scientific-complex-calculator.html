<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Scientific Calculator Pro</title>

<!-- MATH.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(circle at top,#1e293b,#020617 70%);

    padding:20px;
}

/* ================= WRAPPER ================= */

.wrapper{

    display:flex;

    gap:24px;

    align-items:flex-start;

    flex-wrap:wrap;
}

/* ================= CALCULATOR ================= */

.calculator{

    width:470px;

    background:rgba(15,23,42,0.96);

    border-radius:30px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,0.06);

    box-shadow:
    0 30px 80px rgba(0,0,0,0.55);
}

/* ================= DISPLAY ================= */

.top{

    padding:30px 25px;

    border-bottom:1px solid rgba(255,255,255,0.06);
}

.title{

    color:#94a3b8;

    font-size:13px;

    letter-spacing:3px;

    margin-bottom:18px;

    text-transform:uppercase;
}

.history-expression{

    text-align:right;

    color:#64748b;

    min-height:22px;

    margin-bottom:12px;

    overflow-x:auto;

    font-size:15px;
}

.display{

    width:100%;

    background:transparent;

    border:none;

    outline:none;

    color:white;

    text-align:right;

    font-size:3rem;

    font-weight:700;
}

/* ================= KEYPAD ================= */

.keypad{

    padding:20px;

    display:flex;

    flex-direction:column;

    gap:18px;
}

/* ================= SCIENTIFIC ROW ================= */

.scientific-grid{

    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:12px;
}

/* ================= MAIN GRID ================= */

.main-grid{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:14px;
}

/* ================= BUTTON ================= */

button{

    border:none;

    height:68px;

    border-radius:20px;

    cursor:pointer;

    color:white;

    font-size:18px;

    font-weight:600;

    transition:0.2s;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.04),
    0 8px 18px rgba(0,0,0,0.3);
}

button:hover{

    transform:translateY(-2px);
}

button:active{

    transform:scale(0.96);
}

/* ================= TYPES ================= */

.number{

    background:#0f172a;
}

.operator{

    background:
    linear-gradient(135deg,#0ea5e9,#0284c7);
}

.function{

    background:
    linear-gradient(135deg,#6366f1,#4f46e5);
}

.clear{

    background:
    linear-gradient(135deg,#ef4444,#dc2626);
}

.equal{

    background:
    linear-gradient(135deg,#14b8a6,#0f766e);

    height:150px;

    grid-row:span 2;
}

.zero{

    grid-column:span 2;
}

/* ================= HISTORY PANEL ================= */

.side-panel{

    width:290px;

    background:rgba(15,23,42,0.96);

    border-radius:26px;

    padding:22px;

    border:1px solid rgba(255,255,255,0.06);

    box-shadow:
    0 20px 50px rgba(0,0,0,0.45);
}

.side-title{

    color:white;

    margin-bottom:18px;

    font-size:18px;

    font-weight:700;
}

.history-list{

    display:flex;

    flex-direction:column;

    gap:12px;

    max-height:650px;

    overflow:auto;
}

.history-item{

    background:#0f172a;

    border-radius:18px;

    padding:15px;

    cursor:pointer;

    transition:0.2s;

    border:1px solid rgba(255,255,255,0.04);
}

.history-item:hover{

    background:#172554;
}

.expression{

    color:#94a3b8;

    font-size:14px;

    margin-bottom:6px;

    word-break:break-all;
}

.answer{

    color:white;

    font-size:18px;

    font-weight:700;
}

/* ================= FOOTER ================= */

.footer{

    padding:14px;

    text-align:center;

    color:#64748b;

    font-size:12px;

    border-top:1px solid rgba(255,255,255,0.05);
}

/* ================= MOBILE ================= */

@media(max-width:980px){

    .wrapper{

        justify-content:center;
    }

    .side-panel{

        width:100%;
    }
}

@media(max-width:520px){

    .calculator{

        width:100%;
    }

    button{

        height:60px;

        font-size:15px;
    }

    .equal{

        height:134px;
    }

    .display{

        font-size:2.3rem;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- ================= CALCULATOR ================= -->

    <div class="calculator">

        <!-- DISPLAY -->

        <div class="top">

            <div class="title">
                AI Scientific Calculator Pro
            </div>

            <div 
                class="history-expression"
                id="historyExpression"
            ></div>

            <input 
                type="text"
                id="display"
                class="display"
                readonly
            />

        </div>

        <!-- KEYPAD -->

        <div class="keypad">

            <!-- SCIENTIFIC FUNCTIONS -->

            <div class="scientific-grid">

                <button class="function" onclick="append('sin(')">sin</button>

                <button class="function" onclick="append('cos(')">cos</button>

                <button class="function" onclick="append('tan(')">tan</button>

                <button class="function" onclick="append('log(')">log</button>

                <button class="function" onclick="append('ln(')">ln</button>

                <button class="function" onclick="append('sqrt(')">√</button>

                <button class="function" onclick="append('^')">xʸ</button>

                <button class="function" onclick="append('!')">x!</button>

                <button class="function" onclick="append('pi')">π</button>

                <button class="function" onclick="append('e')">e</button>

            </div>

            <!-- MAIN CALCULATOR -->

            <div class="main-grid">

                <!-- ROW 1 -->

                <button class="clear" onclick="clearDisplay()">AC</button>

                <button class="function" onclick="backspace()">⌫</button>

                <button class="function" onclick="append('(')">(</button>

                <button class="operator" onclick="append('/')">÷</button>

                <!-- ROW 2 -->

                <button class="number" onclick="append('7')">7</button>

                <button class="number" onclick="append('8')">8</button>

                <button class="number" onclick="append('9')">9</button>

                <button class="operator" onclick="append('*')">×</button>

                <!-- ROW 3 -->

                <button class="number" onclick="append('4')">4</button>

                <button class="number" onclick="append('5')">5</button>

                <button class="number" onclick="append('6')">6</button>

                <button class="operator" onclick="append('-')">−</button>

                <!-- ROW 4 -->

                <button class="number" onclick="append('1')">1</button>

                <button class="number" onclick="append('2')">2</button>

                <button class="number" onclick="append('3')">3</button>

                <button class="operator" onclick="append('+')">+</button>

                <!-- ROW 5 -->

                <button class="number zero" onclick="append('0')">0</button>

                <button class="number" onclick="append('.')">.</button>

                <button class="equal" onclick="calculate()">=</button>

            </div>

        </div>

        <div class="footer">
            Better Button Layout + Smart History System
        </div>

    </div>

    <!-- ================= HISTORY PANEL ================= -->

    <div class="side-panel">

        <div class="side-title">
            Calculation History
        </div>

        <div 
            class="history-list"
            id="historyList"
        ></div>

    </div>

</div>

<script>

/* ================= ELEMENTS ================= */

const display =
document.getElementById("display");

const historyExpression =
document.getElementById("historyExpression");

const historyList =
document.getElementById("historyList");

/* ================= MEMORY ================= */

let ans = 0;

/* ================= BASIC ================= */

function append(value){

    display.value += value;
}

function clearDisplay(){

    display.value = "";

    historyExpression.innerText = "";
}

function backspace(){

    display.value =
    display.value.slice(0,-1);
}

/* ================= SMART FIX ================= */

function smartFix(expression){

    expression = expression
    .replace(/÷/g,"/")
    .replace(/×/g,"*");

    /* AUTO CLOSE BRACKETS */

    let open =
    (expression.match(/\(/g)||[]).length;

    let close =
    (expression.match(/\)/g)||[]).length;

    while(close < open){

        expression += ")";
        close++;
    }

    /* REMOVE DOUBLE OPERATORS */

    expression =
    expression.replace(/([+\-*/]){2,}/g,
    (match)=>match.slice(-1));

    /* AUTO MULTIPLICATION */

    expression =
    expression.replace(/(\d)(\()/g,"$1*(");

    expression =
    expression.replace(/(\))(\d)/g,")*$2");

    expression =
    expression.replace(
        /(\d)(sin|cos|tan|sqrt|log|ln|abs)/g,
        "$1*$2"
    );

    return expression;
}

/* ================= CALCULATE ================= */

function calculate(){

    try{

        let expression =
        display.value;

        if(!expression) return;

        expression =
        smartFix(expression);

        historyExpression.innerText =
        expression;

        let result =
        math.evaluate(expression,{
            ans:ans
        });

        if(typeof result === "number"){

            result =
            parseFloat(result.toFixed(10));
        }

        ans = result;

        display.value = result;

        addHistory(expression,result);

    }catch(error){

        display.value = "Invalid";
    }
}

/* ================= HISTORY ================= */

function addHistory(exp,result){

    const item =
    document.createElement("div");

    item.className = "history-item";

    item.innerHTML = `

        <div class="expression">
            ${exp}
        </div>

        <div class="answer">
            ${result}
        </div>

    `;

    item.onclick = ()=>{

        display.value = exp;
    };

    historyList.prepend(item);
}

/* ================= KEYBOARD ================= */

document.addEventListener("keydown",(e)=>{

    if(

        (e.key >= 0 && e.key <= 9)

        ||

        "+-*/.%()^".includes(e.key)

    ){

        append(e.key);
    }

    else if(e.key === "Enter"){

        calculate();
    }

    else if(e.key === "Backspace"){

        backspace();
    }

    else if(e.key.toLowerCase() === "c"){

        clearDisplay();
    }
});

</script>

</body>
</html>
