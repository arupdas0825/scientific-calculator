<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Scientific Calculator</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: "Inter", sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
      radial-gradient(circle at top left,#1f2937,#020617 60%);
      overflow:hidden;
      padding:20px;
    }

    .calculator{
      width:420px;
      background:rgba(15,23,42,0.75);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius:28px;
      box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 1px 1px rgba(255,255,255,0.08);
      overflow:hidden;
    }

    .top{
      padding:28px;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }

    .brand{
      color:#94a3b8;
      font-size:13px;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-bottom:16px;
    }

    .display{
      width:100%;
      background:transparent;
      border:none;
      outline:none;
      color:#fff;
      text-align:right;
      font-size:3rem;
      font-weight:600;
      min-height:70px;
    }

    .history{
      text-align:right;
      color:#64748b;
      font-size:15px;
      min-height:24px;
      margin-bottom:8px;
      overflow:hidden;
    }

    .buttons{
      padding:20px;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:14px;
    }

    button{
      border:none;
      height:68px;
      border-radius:18px;
      font-size:18px;
      font-weight:600;
      cursor:pointer;
      transition:0.2s ease;
      color:white;
      background:rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.04),
      0 6px 12px rgba(0,0,0,0.25);
    }

    button:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,0.08);
    }

    button:active{
      transform:scale(0.96);
    }

    .operator{
      background:linear-gradient(135deg,#2563eb,#1d4ed8);
    }

    .equal{
      background:linear-gradient(135deg,#06b6d4,#0891b2);
      grid-column: span 2;
    }

    .special{
      background:linear-gradient(135deg,#7c3aed,#6d28d9);
    }

    .danger{
      background:linear-gradient(135deg,#ef4444,#dc2626);
    }

    .footer{
      padding:14px;
      text-align:center;
      color:#64748b;
      font-size:12px;
      border-top:1px solid rgba(255,255,255,0.05);
    }

    @media(max-width:480px){
      .calculator{
        width:100%;
      }

      button{
        height:60px;
        font-size:16px;
      }

      .display{
        font-size:2.3rem;
      }
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="top">
      <div class="brand">Scientific Calculator</div>

      <div class="history" id="history"></div>

      <input 
        type="text"
        class="display"
        id="display"
        readonly
      />
    </div>

    <div class="buttons">

      <button class="danger" onclick="clearDisplay()">AC</button>
      <button class="special" onclick="append('(')">(</button>
      <button class="special" onclick="append(')')">)</button>
      <button class="special" onclick="append('%')">%</button>
      <button class="operator" onclick="append('/')">÷</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="special" onclick="append('Math.sqrt(')">√</button>
      <button class="operator" onclick="append('*')">×</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="special" onclick="append('**')">x²</button>
      <button class="operator" onclick="append('-')">−</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="special" onclick="append('Math.PI')">π</button>
      <button class="operator" onclick="append('+')">+</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="special" onclick="append('Math.E')">e</button>
      <button class="special" onclick="append('Math.log10(')">log</button>
      <button class="equal" onclick="calculate()">=</button>

      <button class="special" onclick="append('Math.sin(')">sin</button>
      <button class="special" onclick="append('Math.cos(')">cos</button>
      <button class="special" onclick="append('Math.tan(')">tan</button>
      <button class="special" onclick="append('Math.log(')">ln</button>
      <button class="special" onclick="append('Math.pow(')">pow</button>

    </div>

    <div class="footer">
      Advanced Glassmorphism Scientific Calculator UI
    </div>

  </div>

  <script>

    const display = document.getElementById("display");
    const history = document.getElementById("history");

    function append(value){
      display.value += value;
    }

    function clearDisplay(){
      display.value = "";
      history.innerText = "";
    }

    function calculate(){

      try{

        let expression = display.value;

        history.innerText = expression;

        let result = eval(expression);

        display.value = result;

      }catch(error){

        display.value = "Error";

      }
    }

    document.addEventListener("keydown",(e)=>{

      if((e.key >= 0 && e.key <=9) || "+-*/.%()".includes(e.key)){
        append(e.key);
      }

      else if(e.key === "Enter"){
        calculate();
      }

      else if(e.key === "Backspace"){
        display.value = display.value.slice(0,-1);
      }

      else if(e.key.toLowerCase() === "c"){
        clearDisplay();
      }

    });

  </script>

</body>
</html>
